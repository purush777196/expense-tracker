spring:
  application:
    name: expense-tracker-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# ------------------------------------------------------------------------------
# Production / Default Datasource & JPA (PostgreSQL)
# ------------------------------------------------------------------------------
spring.datasource:
  url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_tracker}?useSSL=false&serverTimezone=UTC
  username: ${DB_USERNAME:postgres}
  password: ${DB_PASSWORD:postgres}
  driver-class-name: org.postgresql.Driver
  hikari:
    pool-name: ExpenseTrackerHikariPool
    maximum-pool-size: 15
    minimum-idle: 5
    connection-timeout: 20000
    idle-timeout: 300000
    max-lifetime: 1200000

spring.jpa:
  hibernate:
    ddl-auto: validate
  open-in-view: false
  show-sql: false
  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: false
      jdbc:
        batch_size: 25
        order_inserts: true
        order_updates: true

# ------------------------------------------------------------------------------
# Flyway Database Migration Configuration
# ------------------------------------------------------------------------------
spring.flyway:
  enabled: true
  baseline-on-migrate: true
  validate-on-migrate: true
  locations: classpath:db/migration

# ------------------------------------------------------------------------------
# Application Security & Custom Configuration
# ------------------------------------------------------------------------------
app:
  jwt:
    # Must be supplied via environment variable JWT_SECRET (minimum 32 characters)
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1leHBlbnNlLXRyYWNrZXItand0LXNlY3JldC1rZXktZm9yLWhzMjU2LXB1cnBvc2Vz}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 1500
    read-timeout-ms: 2000

# ------------------------------------------------------------------------------
# Actuator Health & Metrics
# ------------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ------------------------------------------------------------------------------
# OpenAPI & Swagger UI
# ------------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
